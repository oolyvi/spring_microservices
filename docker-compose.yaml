# ATM microservices - PostgreSQL, Kafka (KRaft), Eureka, API gateway and the business services
# Usage:  cp .env.example .env  &&  docker compose up --build -d

x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

services:

  # infrastructure
  postgres:
    image: postgres:17-alpine
    container_name: atm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-oolyvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # creates account_db, admin_db, atm_db, card_db, cash_db, customer_db, transaction_db on first start
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - atm-network

  # Single-node Kafka in KRaft mode
  # containers -> kafka:9092
  # your host -> localhost:29092 (for running a service from the IDE)
  kafka:
    image: apache/kafka:3.9.0
    container_name: atm-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - atm-network

  service-registry:
    build:
      context: ./service-registry
    container_name: atm-service-registry
    restart: unless-stopped
    environment:
      EUREKA_INSTANCE_HOSTNAME: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - atm-network

  # business services
  account-service:
    build:
      context: ./account-service
    container_name: atm-account-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: account-service
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  admin-service:
    build:
      context: ./admin-service
    container_name: atm-admin-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: admin-service
      DB_URL: jdbc:postgresql://postgres:5432/admin_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  atm-service:
    build:
      context: ./atm-service
    container_name: atm-atm-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: atm-service
      DB_URL: jdbc:postgresql://postgres:5432/atm_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  card-service:
    build:
      context: ./card-service
    container_name: atm-card-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: card-service
      DB_URL: jdbc:postgresql://postgres:5432/card_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  cash-service:
    build:
      context: ./cash-service
    container_name: atm-cash-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: cash-service
      DB_URL: jdbc:postgresql://postgres:5432/cash_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  customer-service:
    build:
      context: ./customer-service
    container_name: atm-customer-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: customer-service
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  notification-service:
    build:
      context: ./notification-service
    container_name: atm-notification-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME:-recipient@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-xxxx xxxx xxxx xxxx}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-recipient@gmail.com}
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  transaction-service:
    build:
      context: ./transaction-service
    container_name: atm-transaction-service
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: transaction-service
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      DB_USERNAME: ${POSTGRES_USER:-oolyvi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  web-client:
    build:
      context: ./web-client
    container_name: atm-web-client
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: web-client
    ports:
      - "8089:8089"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

  # entry point
  api-gateway:
    build:
      context: ./api-gateway
    container_name: atm-api-gateway
    restart: unless-stopped
    environment:
      <<: *eureka-env
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    ports:
      - "8765:8765"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - atm-network

volumes:
  postgres_data:
  kafka_data:

networks:
  atm-network:
    driver: bridge