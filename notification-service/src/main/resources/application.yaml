server:
  port: 8087

spring:
  application:
    name: notification-service

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:recipient@gmail.com}
    password: ${MAIL_PASSWORD:xxxx xxxx xxxx xxxx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.trusted.packages]": com.atm.notificationservice.event
        "[spring.json.type.mapping]": transactionCompleted:com.atm.notificationservice.event.TransactionCompletedEvent,cashLow:com.atm.notificationservice.event.CashLowEvent,cardEvent:com.atm.notificationservice.event.CardEvent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

atm:
  kafka:
    topics:
      transaction-completed: atm.transactions.completed
      cash-low: atm.cash.low
      card-events: atm.card.events

notification:
  # optional: low-cash alerts are also e-mailed here when set MAIL_USERNAME & MAIL_PASSWORD
  admin-email: ${ADMIN_EMAIL:}